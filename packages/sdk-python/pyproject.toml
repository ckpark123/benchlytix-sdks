[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchlytix"
version = "0.2.0"
description = "Official Python SDK for the BenchLytix Machine API — agent trust scores, leaderboards, and verification."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BenchLytix", email = "support@benchlytix.com" }]
keywords = ["benchlytix", "ai-agents", "leaderboard", "verification", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
]

[project.urls]
Homepage = "https://benchlytix.com/for/agents"
Documentation = "https://benchlytix.com/api/docs"
Repository = "https://github.com/ckpark123/benchlytix-sdks"
Issues = "https://github.com/ckpark123/benchlytix-sdks/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
benchlytix = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
